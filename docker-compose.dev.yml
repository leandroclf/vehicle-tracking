services:
  postgres:
    image: postgres:15-alpine
    container_name: yukz-postgres-dev
    environment:
      - POSTGRES_DB=vehicle_tracking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yukz-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      cache_from:
        - node:20-alpine
      args:
        - NODE_ENV=development
    ports:
      - "3000:3000"
      - "3001:3001"  # WebSocket server
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/vehicle_tracking
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-key
      - JWT_EXPIRES_IN=7d
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - WS_PORT=3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      # Hot reload - código fonte
      - .:/app
      - /app/node_modules
      - /app/.next
      # Cache persistente
      - nextjs-cache:/app/.next/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tracker-server:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  tracker-server:
    build:
      context: ./tracker-server
      dockerfile: Dockerfile
      cache_from:
        - node:20-alpine
    ports:
      - "8080:8080"  # Teltonika
      - "8081:8081"  # Queclink
      - "8082:8082"  # Concox
      - "8083:8083"  # UDP
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/vehicle_tracking
      - REDIS_URL=redis://redis:6379
    volumes:
      # Hot reload - código fonte
      - ./tracker-server:/app
      - /app/node_modules
      # Cache persistente
      - npm-cache-tracker:/root/.npm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  nextjs-cache:
    driver: local
  npm-cache:
    driver: local
  npm-cache-tracker:
    driver: local

networks:
  app-network:
    driver: bridge