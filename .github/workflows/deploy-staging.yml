name: deploy-staging

# Deliberately isolated: manually started from main, never production.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vehicle-tracking-staging-deploy
  cancel-in-progress: false

jobs:
  staging:
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'leandroclf/vehicle-tracking' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - name: Verify staging-only configuration
        env:
          HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
          CF_ACCOUNT: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT" && test -n "$CF_TOKEN" || { echo "Staging-only Cloudflare credentials are required"; exit 1; }
          case "$HEALTH_URL" in
            https://*) ;;
            *) echo "STAGING_HEALTH_URL must use HTTPS"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run product validation
        run: pnpm validate
      - name: Build Worker for pinned source
        run: pnpm build:worker
        env:
          RELEASE_SHA: ${{ github.sha }}
      - name: Fetch immutable platform G7 verifier
        uses: actions/checkout@v4
        with:
          repository: leandroclf/product-platform
          ref: 28d8d6c815b511b5e73002db3317dbdfd5f813f4
          path: .trusted-platform-g7
          persist-credentials: false
          # This step needs repository access; private repo workflows should use
          # a read-only installation token, not a broad personal access token.
          token: ${{ secrets.PLATFORM_READ_TOKEN }}
      - name: Validate pinned G7 verifier before deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .trusted-platform-g7/packages/kit/scripts/verify-post-deploy-health.py
          python3 .trusted-platform-g7/packages/kit/scripts/verify-post-deploy-health.test.py
      - name: Verify staging bundle bytes before remote deploy
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)" || { echo "Checkout SHA mismatch"; exit 1; }
          pnpm exec wrangler deploy --env staging --dry-run --outdir .g6-staging-predeploy
          python3 scripts/verify-staging-dry-run.py \
            --directory .g6-staging-predeploy \
            --source-sha "$GITHUB_SHA"
        env:
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
      - name: Deploy staging Worker only
        run: pnpm exec wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify stable staging health
        env:
          STAGING_HEALTH_URL: ${{ vars.STAGING_HEALTH_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .trusted-platform-g7/packages/kit/scripts/verify-post-deploy-health.py \
            --url "$STAGING_HEALTH_URL" --attempts 5 --interval 3 \
            --timeout 5 --consecutive-successes 3
