name: deploy

on:
  # Production changes must be deliberate. A merge to main is not permission to migrate or deploy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate

  migrate:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production release preflight
        env:
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Only main can deploy"; exit 1; }
          case "$PRODUCTION_HEALTH_URL" in
            https://?*) ;;
            *) echo "A configured HTTPS production health URL is mandatory"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:worker
        env:
          RELEASE_SHA: ${{ github.sha }}
      - run: pnpm wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Mandatory post-deploy smoke test
        env:
          PRODUCTION_HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: curl --fail --silent --show-error --location --max-time 15 --retry 5 --retry-delay 3 "$PRODUCTION_HEALTH_URL"
