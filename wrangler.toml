#:schema node_modules/wrangler/config-schema.json
name = "yukz-app"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
ENVIRONMENT = "development"

# Non-production Worker is intentionally isolated from the production name.
# No secrets, routes, KV, R2, D1, or external service bindings are configured
# until independent staging resources and GitHub environment are reviewed.
[env.staging]
name = "yukz-app-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
APP_ENV = "staging"

[env.production.vars]
ENVIRONMENT = "production"
APP_ENV = "production"

# Runtime secrets are configured with "wrangler secret put <NAME> --env production".
# Do not commit DATABASE_URL, JWT_SECRET or payment gateway credentials.
