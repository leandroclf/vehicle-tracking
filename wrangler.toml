#:schema node_modules/wrangler/config-schema.json
name = "yukz-app"
main = ".open-next/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
ENVIRONMENT = "development"

[env.production.vars]
ENVIRONMENT = "production"
APP_ENV = "production"

# Runtime secrets are configured with "wrangler secret put <NAME> --env production".
# Do not commit DATABASE_URL, JWT_SECRET or payment gateway credentials.
