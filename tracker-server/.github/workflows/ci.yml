name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Typecheck, lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

  integration:
    name: Testes de integração (PostgreSQL efêmero)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: vehicle_tracking
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar migrações
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql "$DATABASE_URL" -f migrations/init.sql
          psql "$DATABASE_URL" -f migrations/post_baseline_hardening.sql
        env:
          DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/vehicle_tracking
      - run: pnpm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres123@localhost:5432/vehicle_tracking
