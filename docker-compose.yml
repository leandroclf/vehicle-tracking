version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: yukz-postgres
    environment:
      - POSTGRES_DB=vehicle_tracking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - yukz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yukz-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - yukz-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      cache_from:
        - node:20-alpine
        - vehicle-tracking-app:latest
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: vehicle-tracking-app:latest
    container_name: yukz-app
    ports:
      - "3000:3000"
      - "3001:3001"  # WebSocket server
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vehicle_tracking
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
      - WS_PORT=3001
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    networks:
      - yukz-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tracker-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  tracker-server:
    build:
      context: ./tracker-server
      dockerfile: Dockerfile
      cache_from:
        - node:20-alpine
        - vehicle-tracking-tracker-server:latest
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: vehicle-tracking-tracker-server:latest
    container_name: yukz-tracker-server
    ports:
      - "8080:8080"  # Teltonika
      - "8081:8081"  # Queclink  
      - "8082:8082"  # Concox
      - "8083:8083"  # UDP
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vehicle_tracking
      - REDIS_URL=redis://redis:6379
    networks:
      - yukz-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  yukz-network:
    driver: bridge